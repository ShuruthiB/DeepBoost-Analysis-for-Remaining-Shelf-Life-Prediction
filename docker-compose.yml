services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEEPBOOST_DATABASE_PATH: /app/data/inventory.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - deepboost-data:/app/data

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  deepboost-data:
